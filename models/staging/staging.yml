version: 2

models:

  - name: stg_company
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: siren
        data_tests:
          - not_null

      - name: name
        data_tests:
          - not_null

      - name: postal_code
        data_tests:
          - not_null

      - name: city
        data_tests:
          - not_null

      - name: web_domain
        data_tests:
          - not_null

      - name: website_url
        data_tests:
          - not_null

      - name: source_type
        data_tests:
          - not_null

      - name: source_name
        data_tests:
          - not_null

      - name: created_at
        data_tests:
          - not_null


  - name: stg_contact
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company')
                field: id

      - name: job_title
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null


  - name: stg_salesperson
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: initials
        data_tests:
          - not_null
          - unique


  - name: stg_call
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company')
                field: id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesperson')
                field: id

      - name: called_at
        data_tests:
          - not_null

      - name: call_type
        data_tests:
          - not_null

      - name: call_duration_seconds
        data_tests:
          - not_null

      - name: call_outcome
        data_tests:
          - not_null

      - name: demo_scheduled
        data_tests:
          - not_null


  - name: stg_demo
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company')
                field: id

      - name: call_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_call')
                field: id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesperson')
                field: id

      - name: scheduled_at
        data_tests:
          - not_null

      - name: demo_source
        data_tests:
          - not_null


  - name: stg_product
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: product_code
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: product_type
        data_tests:
          - not_null

      - name: commercial_phase
        data_tests:
          - not_null


  - name: stg_deal
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company')
                field: id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesperson')
                field: id

      - name: demo_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_demo')
                field: id

      - name: signed_at
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null

      - name: installation_amount
        data_tests:
          - not_null

      - name: monthly_recurring_amount
        data_tests:
          - not_null


  - name: stg_deal_product
    columns:
      - name: id
        data_tests:
          - not_null
          - unique

      - name: deal_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_deal')
                field: id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_product')
                field: id