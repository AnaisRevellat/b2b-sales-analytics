version: 2

models:

  - name: dim_company
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique


  - name: dim_salesperson
    columns:
      - name: salesperson_id
        data_tests:
          - not_null
          - unique

      - name: initials
        data_tests:
          - not_null
          - unique


  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_code
        data_tests:
          - not_null
          - unique


  - name: fct_calls
    columns:
      - name: call_id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id

      - name: commercial_phase
        data_tests:
          - not_null


  - name: fct_demos
    columns:
      - name: demo_id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id

      - name: call_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_calls')
                field: call_id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id

      - name: commercial_phase
        data_tests:
          - not_null


  - name: fct_deals
    columns:
      - name: deal_id
        data_tests:
          - not_null
          - unique

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id

      - name: demo_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_demos')
                field: demo_id

      - name: signed_at
        data_tests:
          - not_null

      - name: installation_amount
        data_tests:
          - not_null

      - name: monthly_recurring_amount
        data_tests:
          - not_null

      - name: commercial_phase
        data_tests:
          - not_null


  - name: bridge_deal_product
    columns:
      - name: deal_product_id
        data_tests:
          - not_null
          - unique

      - name: deal_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_deals')
                field: deal_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id


  - name: mart_sales_funnel
    columns:
      - name: activity_month
        data_tests:
          - not_null

      - name: commercial_phase
        data_tests:
          - not_null

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id


  - name: mart_sales_performance
    columns:
      - name: activity_month
        data_tests:
          - not_null

      - name: commercial_phase
        data_tests:
          - not_null

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id


  - name: mart_product_performance
    columns:
      - name: activity_month
        data_tests:
          - not_null

      - name: commercial_phase
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id

      - name: salesperson_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_id